name: Publish ScoreX Phase 1 Preview Image

on:
  push:
    branches:
      - hardening/phase-1-security
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'client/**'
      - '.github/workflows/publish-phase1-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: scorex-phase1-image
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local smoke-test image
        run: |
          docker build \
            --build-arg SCOREX_GIT_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg SCOREX_GIT_COMMIT_SHA="${GITHUB_SHA}" \
            -t scorex-phase1:smoke .

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name scorex-phase1-smoke \
            -e PORT=5001 \
            -e NODE_ENV=production \
            -p 5001:5001 \
            scorex-phase1:smoke

          cleanup() {
            docker logs scorex-phase1-smoke || true
            docker stop scorex-phase1-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5001/api/health >/tmp/scorex-health.json; then
              cat /tmp/scorex-health.json
              exit 0
            fi
            sleep 2
          done

          echo 'ScoreX container did not become healthy in time.' >&2
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scorex
          tags: |
            type=raw,value=phase-1
            type=sha,prefix=phase-1-sha-
          labels: |
            org.opencontainers.image.title=ScoreX Phase 1 Preview
            org.opencontainers.image.description=ScoreX security-hardened Phase 1 preview build
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish Phase 1 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SCOREX_GIT_BRANCH=${{ github.ref_name }}
            SCOREX_GIT_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
